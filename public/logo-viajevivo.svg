<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="ViajeVivo">
  <title>ViajeVivo — viajevivo.com.mx</title>
  <desc>Símbolo de doble trazo: camino esmeralda y lima con punto de llegada, sobre la marca ViajeVivo.</desc>

  <!-- Sombra suave del símbolo (copia desplazada, compatible con cualquier renderizador) -->
  <g transform="translate(0 7)" opacity="0.16" fill="none" stroke="#0B1F2A" stroke-linecap="round">
    <path d="M 292 42 C 322 80, 356 118, 380 135" stroke-width="34"/>
    <path d="M 376 139 C 418 112, 458 70, 478 34" stroke-width="32"/>
    <path d="M 380 135 C 420 108, 460 68, 480 32" stroke-width="30"/>
    <circle cx="480" cy="30" r="16" fill="#0B1F2A" stroke="none"/>
  </g>

  <!-- Símbolo: V / camino que asciende hacia el destino -->
  <g fill="none" stroke-linecap="round">
    <!-- Brazo esmeralda -->
    <path d="M 292 42 C 322 80, 356 118, 380 135"
          stroke="#0B6E4F" stroke-width="32"/>
    <!-- Solape oscuro bajo la cinta lima (da profundidad) -->
    <path d="M 376 139 C 418 112, 458 70, 478 34"
          stroke="#0B6E4F" stroke-width="30"/>
    <!-- Brazo lima -->
    <path d="M 380 135 C 420 108, 460 68, 480 32"
          stroke="#B7F34C" stroke-width="28"/>
    <!-- Punto de llegada -->
    <circle cx="480" cy="30" r="15" fill="#0B6E4F" stroke="none"/>
  </g>

  <!-- Marca -->
  <text x="380" y="222" text-anchor="middle"
        font-family="Calibri, 'DejaVu Sans', Arial, sans-serif"
        font-size="80" font-weight="600" letter-spacing="-1.5"
        fill="#0B6E4F">ViajeVivo</text>
</svg>
